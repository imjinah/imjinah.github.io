<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WIS✝FUL WORKS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <pre id="page-frame" aria-hidden="true"></pre>
    <main>
        <h1>WISTFUL WORKS</h1>
        <section class="year-section">
            <h2 id="year-title"></h2>
            <p id="year-details" class="details"></p>
            <div id="year-bar" class="bar" role="progressbar"
                 aria-label="Year progress" aria-valuemin="0" aria-valuemax="100"></div>
        </section>

        <section class="divided">
            <h2>TOUR GUIDE OF THE UNDERWORLD // MARCH 19, 2031</h2>
            <p id="game-details" class="details"></p>
            <div id="game-bar" class="bar" role="progressbar"
                 aria-label="Game progress" aria-valuemin="0" aria-valuemax="100"></div>
        </section>

        <section class="divided calendar-section">
            <h2 id="calendar-title"></h2>
            <div id="calendar"></div>
            <section class="holiday-section" aria-label="Philippine public holidays">
                <ul id="holiday-list" class="holiday-list" aria-label="2026 public holidays"></ul>
                <p id="holiday-status" class="holiday-status" role="status" hidden></p>
            </section>
        </section>
    </main>
</body>
</html>
